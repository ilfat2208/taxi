server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/taxi_payment}
    username: ${POSTGRES_USER:taxi}
    password: ${POSTGRES_PASSWORD:taxi}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: payment-pool
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

taxi:
  security:
    # HMAC (shared secret, HS256) is the default. JWT_MODE=JWKS makes this service verify
    # the issuer's RS256 tokens against its public key set and hold no signing material
    # at all — that is the point: with a shared secret any service could mint an ADMIN token.
    mode: ${JWT_MODE:HMAC}
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    # Required in JWKS mode (ignored in HMAC mode); empty means "not configured".
    jwk-set-uri: ${JWK_SET_URI:}
    # How long a downloaded key set is cached before it is fetched again.
    jwks-cache-ttl: ${JWKS_CACHE_TTL:5m}
    jwt-ttl: ${JWT_TTL_SECONDS:3600}s
    issuer: ${JWT_ISSUER:https://identity.taxi.local}
    # Expected `iss` claim; leave empty to use `issuer` above.
    issuer-uri: ${JWT_ISSUER_URI:}
    roles-claim: roles
    # The platform default for internal endpoints is "/api/v1/**/internal/**", and
    # with Spring Security 6.3 that pattern is evaluated by MvcRequestMatcher, whose
    # PathPattern parser rejects a "**" that is not the last element
    # (PatternParseException: "No more pattern data allowed after {*...} or ** pattern
    # element"). The result is that a JWT-less call to an internal endpoint is refused
    # before it ever reaches the internal-token filter, and the service's own
    # background jobs (a recovery job, a Kafka listener) cannot read anything.
    # Listing the internal namespace explicitly keeps those callers working; the paths
    # are still guarded by InternalApiTokenFilter, which runs before this chain and
    # rejects every /internal/ request without a valid X-Internal-Token.
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /api/v1/payments/internal/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /error
  idempotency:
    store: redis
    ttl: 24h
  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100
    max-attempts: 10
  kafka:
    partitions: 3
    replicas: 1
    dedup:
      store: redis
      ttl: 7d
  internal:
    token: ${INTERNAL_API_TOKEN:local-internal-token-change-me}
  # Downstream services. Timeouts are explicit: a payment must fail fast and
  # compensate rather than hold a hold open while a caller hangs.
  clients:
    # Where settlement asks who owns a merchant and where to pay it.
    catalog-service:
      url: ${CATALOG_SERVICE_URL:http://127.0.0.1:8083}
      connect-timeout: 2s
      read-timeout: 5s
    account-service:
      url: ${ACCOUNT_SERVICE_URL:http://127.0.0.1:8081}
      connect-timeout: 2s
      read-timeout: 5s
  reconciliation:
    # Сверка данных: инварианты, которые уже держит код и БД, но которые
    # дешевле проверять регулярно, чем узнать о расхождении от мерчанта.
    interval-ms: 900000
    initial-delay-ms: 120000
    batch-size: 500

  settlement:
    # Money owed to merchants. The hold period is the commercial rule: a sale is
    # held briefly so a refund can still be absorbed before it is paid out.
    enabled: ${SETTLEMENT_ENABLED:true}
    hold-period: ${SETTLEMENT_HOLD_PERIOD:1h}
    auto-payout: ${SETTLEMENT_AUTO_PAYOUT:true}
    run-interval-ms: 60000
    initial-delay-ms: 30000
    batch-size: 50
  payments:
    # Fees are a product decision, not a code decision: basis points, per type.
    transfer-fee-bp: ${PAYMENT_TRANSFER_FEE_BP:0}
    merchant-fee-bp: ${PAYMENT_MERCHANT_FEE_BP:150}
    page-size-default: 20
    page-size-max: 100
    # Documented name of the saga timeout; saga.stuck-threshold below is the same
    # setting under its original name and wins when it is set explicitly.
    saga-timeout: ${PAYMENT_SAGA_TIMEOUT:2m}
    # The saga is only allowed to move money in one direction; anything that
    # cannot reach a terminal state has to be resolved by the recovery job.
    saga:
      # A payment older than this that never reached a terminal state had its
      # driving process killed -> the job resumes or fails it (see the job's Javadoc).
      stuck-threshold: ${PAYMENT_SAGA_STUCK_THRESHOLD:2m}
      # Durations in milliseconds, like every other @Scheduled job on the platform:
      # fixedDelayString and initialDelayString are parsed as numbers, so "30s"
      # fails at startup rather than at 3 a.m.
      fixed-delay-ms: ${PAYMENT_SAGA_RECOVERY_DELAY_MS:30000}
      initial-delay-ms: ${PAYMENT_SAGA_INITIAL_DELAY_MS:30000}
      batch-size: 50
      # Resumption attempts recorded in payment_transition (actor='recovery')
      # before a payment is failed deterministically instead of retried forever.
      max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    kz.taxi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"


