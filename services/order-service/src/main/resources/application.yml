server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/taxi_order}
    username: ${POSTGRES_USER:taxi}
    password: ${POSTGRES_PASSWORD:taxi}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: order-pool
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    schemas: orders
    default-schema: orders
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

taxi:
  orders:
    # Delivery is free by default: a fee the customer only discovers at the
    # payment step is the fastest way to lose a paid order.
    delivery-fee-minor: ${ORDER_DELIVERY_FEE_MINOR:0}
    # How long an order may stay PENDING_PAYMENT before the recovery job resolves
    # it. Must exceed the payment service's own worst case.
    saga-timeout: ${ORDER_SAGA_TIMEOUT:5m}
    recovery-batch-size: ${ORDER_RECOVERY_BATCH_SIZE:50}
    recovery-initial-delay-ms: ${ORDER_RECOVERY_INITIAL_DELAY_MS:20000}
    recovery-interval-ms: ${ORDER_RECOVERY_INTERVAL_MS:60000}
  security:
    # HMAC (shared secret, HS256) is the default. JWT_MODE=JWKS makes this service verify
    # the issuer's RS256 tokens against its public key set and hold no signing material
    # at all — that is the point: with a shared secret any service could mint an ADMIN token.
    mode: ${JWT_MODE:HMAC}
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    # Required in JWKS mode (ignored in HMAC mode); empty means "not configured".
    jwk-set-uri: ${JWK_SET_URI:}
    # How long a downloaded key set is cached before it is fetched again.
    jwks-cache-ttl: ${JWKS_CACHE_TTL:5m}
    jwt-ttl: ${JWT_TTL_SECONDS:3600}s
    issuer: ${JWT_ISSUER:https://identity.taxi.local}
    # Expected `iss` claim; leave empty to use `issuer` above.
    issuer-uri: ${JWT_ISSUER_URI:}
    roles-claim: roles
  idempotency:
    store: redis
    ttl: 24h
  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100
    max-attempts: 10
  kafka:
    partitions: 3
    replicas: 1
    dedup:
      store: redis
      ttl: 7d
  internal:
    token: ${INTERNAL_API_TOKEN:local-internal-token-change-me}
  clients:
    catalog-service:
      url: ${CATALOG_SERVICE_URL:http://127.0.0.1:8083}
      connect-timeout: 2s
      read-timeout: 5s
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8082}
      connect-timeout: 2s
      read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    kz.taxi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"


