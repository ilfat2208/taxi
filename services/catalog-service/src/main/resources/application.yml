server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/taxi_catalog}
    username: ${POSTGRES_USER:taxi}
    password: ${POSTGRES_PASSWORD:taxi}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: catalog-pool
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: catalog
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    schemas: catalog
    default-schema: catalog
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

taxi:
  security:
    # HMAC (shared secret, HS256) is the default. JWT_MODE=JWKS makes this service verify
    # the issuer's RS256 tokens against its public key set and hold no signing material
    # at all — that is the point: with a shared secret any service could mint an ADMIN token.
    mode: ${JWT_MODE:HMAC}
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    # Required in JWKS mode (ignored in HMAC mode); empty means "not configured".
    jwk-set-uri: ${JWK_SET_URI:}
    # How long a downloaded key set is cached before it is fetched again.
    jwks-cache-ttl: ${JWKS_CACHE_TTL:5m}
    jwt-ttl: ${JWT_TTL_SECONDS:3600}s
    issuer: ${JWT_ISSUER:https://identity.taxi.local}
    # Expected `iss` claim; leave empty to use `issuer` above.
    issuer-uri: ${JWT_ISSUER_URI:}
    roles-claim: roles
    # Browsing the marketplace is anonymous: search, product cards, categories and
    # the public seller summary. Listing the platform defaults again is not noise —
    # supplying this property replaces them, so dropping actuator/swagger would lock
    # out the probes and the API docs.
    #
    # The /internal/** entries are here for a different reason: those paths are
    # authenticated as a workload by InternalApiTokenFilter (X-Internal-Token), which
    # runs before the security filter chain, and the order service has no user token
    # to present. Writes on the same public paths (POST/PATCH of products, POST of
    # merchants) stay protected by @PreAuthorize on the controller.
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /error
      - /api/v1/catalog/products
      - /api/v1/catalog/products/*
      - /api/v1/catalog/categories
      - /api/v1/catalog/internal/**
      - /api/v1/merchants/*
  # How long a checkout may hold stock (reservation-ttl) and how often the expiry
  # job looks for holds that ran out: the TTL bounds how long an abandoned cart
  # hides inventory. The delays are milliseconds because that is the only format
  # @Scheduled accepts for initialDelayString.
  catalog:
    reservation-ttl: ${CATALOG_RESERVATION_TTL:30m}
    expiry-scan-interval-ms: ${CATALOG_EXPIRY_SCAN_INTERVAL_MS:60000}
    expiry-initial-delay-ms: ${CATALOG_EXPIRY_INITIAL_DELAY_MS:30000}
  demo:
    seed: ${TAXI_DEMO_SEED:true}
  idempotency:
    store: redis
    ttl: 24h
  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100
    max-attempts: 10
  kafka:
    partitions: 3
    replicas: 1
    dedup:
      store: redis
      ttl: 7d
  internal:
    token: ${INTERNAL_API_TOKEN:local-internal-token-change-me}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    kz.taxi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"


