server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: account-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/taxi_account}
    username: ${POSTGRES_USER:taxi}
    password: ${POSTGRES_PASSWORD:taxi}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: account-pool
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: account
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    schemas: account
    default-schema: account
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 5
        delivery.timeout.ms: 120000
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s

taxi:
  security:
    # HMAC (shared secret, HS256) is the default. JWT_MODE=JWKS makes this service verify
    # the issuer's RS256 tokens against its public key set and hold no signing material
    # at all — that is the point: with a shared secret any service could mint an ADMIN token.
    mode: ${JWT_MODE:HMAC}
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    # Required in JWKS mode (ignored in HMAC mode); empty means "not configured".
    jwk-set-uri: ${JWK_SET_URI:}
    # How long a downloaded key set is cached before it is fetched again.
    jwks-cache-ttl: ${JWKS_CACHE_TTL:5m}
    jwt-ttl: ${JWT_TTL_SECONDS:3600}s
    issuer: ${JWT_ISSUER:https://identity.taxi.local}
    # Expected `iss` claim; leave empty to use `issuer` above.
    issuer-uri: ${JWT_ISSUER_URI:}
    roles-claim: roles
  idempotency:
    store: redis
    ttl: 24h
  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 100
    max-attempts: 10
  kafka:
    partitions: 3
    replicas: 1
    dedup:
      store: redis
      ttl: 7d
  # Shared secret authenticating service-to-service calls on /internal/ endpoints.
  internal:
    token: ${INTERNAL_API_TOKEN:local-internal-token-change-me}
  account:
    # Funds reserved for a payment that never finishes are returned automatically:
    # a crashed checkout must not freeze a customer's money.
    hold-ttl: ${HOLD_TTL:15m}
    hold-expiry-interval-ms: 60000
    hold-expiry-batch-size: 100
    # Anti-fraud velocity control: at most this many outgoing operations (holds) per
    # account inside the window. Amount-independent on purpose — card testing and
    # scripted cash-out look innocent per transaction and obvious per minute.
    # Set max-operations to 0 (or negative) to disable the control without a redeploy.
    velocity:
      max-operations: ${VELOCITY_MAX_OPERATIONS:10}
      window: ${VELOCITY_WINDOW:5m}
  demo:
    # Creates the platform suspense accounts a demo needs; idempotent.
    seed: ${DEMO_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    kz.taxi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

