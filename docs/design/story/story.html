<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORTA — вертикальная история для сторис</title>

<!-- Дизайн-токены и компоненты борда: цвета, радиусы, тени, рамка телефона.
     Файл извлечён из docs/design/orta-screens.html скриптом extract.mjs. -->
<link rel="stylesheet" href="assets/board.css">

<style>
/* ============================================================================
   Кадр истории: 1080x1920 (9:16). Палитра — ORTA Blue из борда, ни одного
   нового цвета: --brand-900/800/500 и чернильная шкала борда.
   ========================================================================== */

html, body {
  margin: 0;
  padding: 0;
  background: #050B16;
  overflow: hidden;
}

#stage {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: var(--font);
  color: #fff;
  background:
    radial-gradient(1100px 760px at 50% -8%, rgba(74, 131, 196, .55), transparent 70%),
    radial-gradient(900px 700px at 88% 92%, rgba(14, 124, 123, .30), transparent 72%),
    linear-gradient(168deg, #0A2540 0%, #071A31 46%, #04101F 100%);
}

/* Двигающаяся сетка: она в каждой сцене, поэтому движение читается даже тогда,
   когда сам экран статичен. */
#stage::before {
  content: "";
  position: absolute;
  inset: -10%;
  background-image:
    linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
  background-size: 96px 96px;
  pointer-events: none;
  z-index: 0;
}

/* Тёплый блик сверху — «камера» стоит под источником света. */
#stage::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(720px 460px at 50% 4%, rgba(255, 255, 255, .12), transparent 68%);
  pointer-events: none;
  z-index: 60;
}

#story { position: absolute; inset: 0; z-index: 10; }

#scenes { position: absolute; inset: 0; }

/* ------------------------------------------------------------------ текст */

.kicker {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--brand-300);
  text-align: center;
  text-shadow: 0 2px 14px rgba(4, 16, 31, .8);
}

.scene-title {
  font-size: 92px;
  line-height: 1.06;
  font-weight: 800;
  letter-spacing: -.014em;
  text-align: center;
  text-shadow: 0 8px 34px rgba(4, 16, 31, .72);
}

.scene-sub {
  font-size: 40px;
  line-height: 1.42;
  font-weight: 500;
  color: rgba(255, 255, 255, .82);
  text-align: center;
  text-shadow: 0 4px 20px rgba(4, 16, 31, .7);
}

.caption {
  font-size: 46px;
  font-weight: 700;
  letter-spacing: .002em;
  text-align: center;
  color: #fff;
  text-shadow: 0 6px 26px rgba(4, 16, 31, .8);
}

/* Компактный вариант для сцен, где рамка экрана занимает почти весь кадр. */
.kicker--sm { font-size: 28px; }
.scene-title--sm { font-size: 78px; }
.scene-sub--sm { font-size: 34px; line-height: 1.4; }

.title {
  font-size: 168px;
  line-height: 1;
  font-weight: 800;
  text-align: center;
  color: #fff;
  text-shadow: 0 14px 52px rgba(4, 16, 31, .8);
}

.tagline {
  font-size: 62px;
  font-weight: 600;
  letter-spacing: .02em;
  text-align: center;
  color: var(--brand-200);
  text-shadow: 0 6px 26px rgba(4, 16, 31, .75);
}

.footnote {
  font-size: 34px;
  line-height: 1.45;
  font-weight: 500;
  text-align: center;
  color: rgba(255, 255, 255, .62);
}

/* Метка ORTA: плитка ORTA Blue с буквой — как логотип в борде и в README. */
.mark {
  width: 300px;
  height: 300px;
  border-radius: 84px;
  background: linear-gradient(150deg, var(--brand-400), var(--brand-600) 62%, var(--brand-800));
  border: 2px solid rgba(255, 255, 255, .30);
  box-shadow:
    0 50px 120px rgba(31, 95, 169, .62),
    0 0 150px rgba(74, 131, 196, .48),
    inset 0 2px 0 rgba(255, 255, 255, .34);
  display: grid;
  place-items: center;
  font-size: 152px;
  line-height: 1;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 8px 26px rgba(4, 16, 31, .5);
}

.rule {
  height: 6px;
  width: 200px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--brand-300), transparent);
  transform-origin: left center;
}

/* --------------------------------------------------------------- прогресс */

.progress {
  position: absolute;
  height: 8px;
  width: 600px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-300), #7FE3D6);
  box-shadow: 0 0 38px rgba(127, 227, 214, .55);
  transform-origin: left center;
}

/* ------------------------------------------------------------ лента экранов */

.track {
  position: absolute;
  display: flex;
  gap: 48px;
  align-items: flex-start;
  z-index: 5;
  isolation: isolate;
}

/* ------------------------------------------------------------------- чипы */

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  align-content: center;
}

.chip {
  display: inline-flex;
  align-items: center;
  padding: 18px 34px;
  border-radius: 999px;
  font-size: 38px;
  font-weight: 600;
  color: #fff;
  background: rgba(255, 255, 255, .12);
  border: 2px solid rgba(255, 255, 255, .24);
  backdrop-filter: blur(6px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
}

.chain {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: .01em;
  text-align: center;
  color: var(--brand-200);
}

.stat-row {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: .06em;
  text-align: center;
  color: rgba(255, 255, 255, .78);
  white-space: nowrap;
}

/* Рамки экранов крупнее обычных теней борда: на тёмном фоне они «висят» в воздухе. */
#story .phone {
  box-shadow:
    0 70px 140px rgba(3, 12, 28, .62),
    0 16px 42px rgba(3, 12, 28, .45),
    0 0 0 1px rgba(255, 255, 255, .10);
}
</style>
</head>
<body>

<!-- Библиотека inline-SVG борда: иконки статус-бара, карта, маршруты. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs id="board-defs"></defs>
</svg>

<div id="stage">
  <div id="story"></div>
</div>

<script type="module">
  // Определения SVG подключаются извлечённым файлом: <use href="#i-wifi"> в экранах
  // телефонов иначе не найдёт свои символы.
  import './assets/defs-inline.js';
  import './story.js';
</script>

</body>
</html>
