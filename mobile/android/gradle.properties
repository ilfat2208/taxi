# This host runs the whole backend stack + Docker and is under heavy memory pressure.
# A per-process address-space cap in this environment rejects any -Xmx above ~1536m
# ("Could not reserve enough space for ... object heap"), so every JVM is kept at or
# below 1.5 GB and Kotlin compilation gets its own process with its own budget.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=1

# Compile Kotlin out-of-process so the Gradle daemon stays small. The heap is kept at 1 GB
# because a larger reservation is refused in this environment.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
