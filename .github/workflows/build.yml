name: build

# Проверяем то, что реально ломается: сборку Java-реактора, unit-тесты, сборку веба.
# Интеграционные тесты (*IT, Testcontainers) вынесены в отдельный job, потому что
# раннеру нужен доступ к Docker-демону — на GitHub-hosted runner он есть.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Отменяем предыдущий прогон той же ветки: экономит минуты и не создаёт очереди.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: '-B -ntp'

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `verify` вместо `test`: собирает, прогоняет unit-тесты всех модулей и
      # проверяет, что каждый сервис действительно превращается в исполняемый jar
      # (spring-boot:repackage падает, если у приложения нет main-класса).
      - name: Build and unit-test the whole reactor
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Профиль integration включает maven-failsafe-plugin: тесты *IT поднимают
      # реальные Postgres и Kafka в контейнерах и проверяют Flyway-миграции,
      # соответствие сущностей схеме (ddl-auto=validate) и инварианты леджера.
      - name: Run Testcontainers integration tests
        run: ./mvnw -B -ntp verify -Pintegration

      # Отчёт Maven сам в аннотации не попадает, а логи GitHub читаются только с
      # токеном. Поэтому на падении превращаем строки отчёта в ::error:: — тогда
      # упавший сценарий виден прямо на коммите и доступен через check-runs API.
      # Контекст (-A 4) важен не меньше имени теста: именно в следующих строках
      # лежит текст исключения, без которого причину не понять.
      - name: Annotate integration failures
        if: failure()
        run: |
          set +e
          find . -path '*/failsafe-reports/*.txt' -type f | while read -r report; do
            grep -A 4 -E '<<< (FAILURE|ERROR)' "$report" | head -40 | while IFS= read -r line; do
              test -z "$line" && continue
              echo "::error::$(printf '%s' "$line" | tr -d '\r\n' | sed 's/%/%25/g')"
            done
          done

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/*.txt'
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build` = tsc --noEmit && vite build: типы проверяются наравне со сборкой.
      - name: Type-check and build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      # Браузерные сценарии требуют живого бэкенда: поднимаем инфраструктуру и
      # сервисы, ждём health, и только потом запускаем Playwright. Иначе тесты
      # проверяют не продукт, а отсутствие API.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the backend
        working-directory: .
        run: |
          docker compose up -d postgres kafka redis
          timeout 180 bash -c 'until [ "$(docker compose ps --format "{{.Health}}" | grep -c healthy)" -ge 3 ]; do sleep 3; done'
          docker compose --profile app up -d --build
          timeout 420 bash -c 'until [ "$(docker compose --profile app ps --format "{{.Service}} {{.Health}}" | grep -c healthy)" -ge 8 ]; do sleep 5; done'
          docker compose --profile app ps

      - name: End-to-end tests (Playwright)
        run: pnpm e2e

      - name: Show service logs on failure
        if: failure()
        working-directory: .
        run: docker compose --profile app logs --tail 150

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose --profile app down -v

  android:
    name: Android (Kotlin + Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      # Живой бэкенд здесь не поднимается: сценарии против реального шлюза сами себя
      # пропускают (assumeTrue), поэтому проверяются компиляция, JVM-тесты и сборка APK.
      # Живые сценарии запускаются локально:
      #   .\gradlew.bat testDebugUnitTest "-Dtaxi.liveTest=true"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Образы собираются, но не публикуются: цель — поймать сломанный Dockerfile
      # или сервис, который перестал быть executable jar.
      - name: Build service images
        run: docker compose --profile app build

      - name: Smoke-test the packaged stack
        run: |
          docker compose up -d postgres kafka redis
          timeout 120 bash -c 'until docker compose ps | grep -q "postgres.*healthy"; do sleep 3; done'
          docker compose --profile app up -d
          echo "Ждём, пока сервисы поднимутся и станут healthy"
          timeout 300 bash -c 'until [ "$(docker compose --profile app ps --format "{{.Health}}" | grep -c healthy)" -ge 5 ]; do sleep 5; done'
          docker compose --profile app ps

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
